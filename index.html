<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>或许TA是异世界的你？！</title>
  <style>
    /* 完全提取自你提供的排版文件色系与字体 */
    :root {
      --paper: #d1c7b7;
      --ink: #f7eedf;
      --bg: #141315;
      --line-heavy: rgba(209, 199, 183, 0.4);
      --line-light: rgba(209, 199, 183, 0.2);
      --line-faint: rgba(209, 199, 183, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--paper);
      font-family: "Georgia", "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* 模拟极淡的复古排版网格背景 */
      background-image: 
        linear-gradient(var(--line-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
    }

    /* 主体档案容器，融合了文件中的矩阵与装订线概念 */
    .archive-matrix {
      position: relative;
      width: min(580px, 100%);
      background: var(--bg);
      border: 1px solid var(--line-heavy);
      padding: 46px 30px 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    /* 顶部打字机索引条 */
    .lead-strip {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--line-light);
      padding: 10px 20px;
      font-family: monospace;
      font-size: 7px;
      letter-spacing: 1.5px;
      color: rgba(209, 199, 183, 0.45);
    }
    
    .lead-strip span:last-child {
      color: var(--ink);
      font-weight: 700;
    }

    /* 标题区 */
    .title-container {
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .title-kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: "Didot", "Bodoni MT", serif;
      font-style: italic;
      font-size: 8.5px;
      letter-spacing: 2px;
      color: rgba(209, 199, 183, 0.4);
      margin-bottom: 14px;
    }

    .title-kicker::before, .title-kicker::after {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--line-light);
    }

    .headline-block {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
    }

    .star-icon {
      width: 22px;
      height: 22px;
      color: var(--paper);
      animation: breathSlow 8.8s ease-in-out infinite;
    }

    .star-icon:last-of-type {
      animation-delay: 4.4s;
    }

    @keyframes breathSlow {
      0%, 100% { opacity: 0.4; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    h1 {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1.1;
      color: var(--ink);
      text-shadow: 0 0 14px rgba(247, 238, 223, 0.16);
      white-space: nowrap;
    }

    /* 标题下方的虚线与小标题 */
    .subtitle-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 24px 0 44px;
      position: relative;
    }

    .subtitle-divider::before, .subtitle-divider::after {
      content: "";
      flex: 1;
      height: 0.5px;
      background: linear-gradient(to right, transparent, var(--line-light), transparent);
    }

    .subtitle-text {
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 0.4em;
      color: var(--paper);
      padding: 0 16px;
      opacity: 0.85;
    }

    /* 核心按钮区：借用文件中的工业档案框风格 */
    .action-zone {
      display: flex;
      justify-content: center;
      margin-bottom: 46px;
    }

    .start-btn {
      position: relative;
      background: rgba(209, 199, 183, 0.03);
      border: 0.5px solid var(--line-heavy);
      padding: 16px 50px;
      cursor: pointer;
      transition: all 0.4s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 按钮右上角的微缩缺口标签 */
    .ind-notch {
      position: absolute;
      top: -4px;
      right: 8px;
      font-size: 5px;
      font-family: monospace;
      background: var(--bg);
      padding: 0 3px;
      color: rgba(209, 199, 183, 0.45);
      border: 0.5px solid var(--line-light);
      line-height: 1;
    }

    .btn-main-text {
      font-family: "Georgia", "Songti SC", serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-indent: 3px;
      color: var(--ink);
      z-index: 1;
      transition: color 0.3s ease;
    }

    .btn-sub-code {
      font-family: monospace;
      font-size: 6px;
      letter-spacing: 1px;
      color: rgba(209, 199, 183, 0.3);
      z-index: 1;
      transition: color 0.3s ease;
    }

    /* 悬停时的充能与发光 */
    .start-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(209, 199, 183, 0.05);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .start-btn:hover {
      border-color: var(--ink);
      box-shadow: inset 0 0 10px rgba(247, 238, 223, 0.05);
    }

    .start-btn:hover::before {
      opacity: 1;
    }

    .start-btn:hover .btn-main-text {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .start-btn:hover .btn-sub-code {
      color: var(--paper);
    }

    /* 底部区：极简消散排版 */
    .terminal-base {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 20px;
    }

    .terminal-base::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--line-light) 50%, transparent);
    }

    .footer-text {
      font-family: monospace;
      font-size: 6.5px;
      letter-spacing: 0.3em;
      color: rgba(209, 199, 183, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-text::before, .footer-text::after {
      content: "◆";
      font-size: 4px;
      color: var(--line-heavy);
    }

    /* 移动端适配 */
    @media (max-width: 520px) {
      .archive-matrix {
        padding: 46px 16px 26px;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 1px;
      }
      .star-icon {
        width: 16px;
        height: 16px;
      }
      .start-btn {
        padding: 14px 30px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="archive-matrix">
    
    <!-- 顶部打字机索引 -->
    <div class="lead-strip">
      <span>FOLIO MATRIX // EXTENDED TRAJECTORY</span>
      <span>VOL. TEARS // [SOAKED]</span>
    </div>

    <!-- 标题区 -->
    <div class="title-container">
      <div class="title-kicker">Q: WHAT IS YOUR TRUE FORM?</div>
      <div class="headline-block">
        <!-- 替换为文件风格的纯细线/灰白闪烁星星 -->
        <svg class="star-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L15 9L23 12L15 15L12 23L9 15L1 12L9 9L12 1Z" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"/>
        </svg>
        
        <h1>或许TA是异世界的你？！</h1>
        
        <svg class="star-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L15 9L23 12L15 15L12 23L9 15L1 12L9 9L12 1Z" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- 小标题分隔线 -->
    <div class="subtitle-divider">
      <div class="subtitle-text">· 九域大陆人物小测试 ·</div>
    </div>

    <!-- 开始测试按钮 -->
    <div class="action-zone">
      <button id="startBtn" class="start-btn" type="button">
        <span class="ind-notch">SYS.01</span>
        <span class="btn-main-text">开始测试</span>
        <span class="btn-sub-code">INITIATE // SEQUENCE</span>
      </button>
    </div>

    <!-- 底部信息 -->
    <div class="terminal-base">
      <div class="footer-text">九域大陆预热小测试</div>
    </div>

  </main>

  <script>
    document.getElementById("startBtn").addEventListener("click", () => {
      // 跳转到试题子页面
      window.location.href = "quiz.html";
    });
  </script>
</body>
</html>
