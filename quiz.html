<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九域大陆人物小测试</title>
  <style>
    /* 提取自中世纪档案排版文件色系与字体 */
    :root {
      --paper: #d1c7b7;
      --ink: #f7eedf;
      --bg: #141315;
      --line-heavy: rgba(209, 199, 183, 0.4);
      --line-light: rgba(209, 199, 183, 0.2);
      --line-faint: rgba(209, 199, 183, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--paper);
      font-family: "Georgia", "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      /* 模拟档案排版网格背景 */
      background-image: 
        linear-gradient(var(--line-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center top;
      background-attachment: fixed;
    }

    .quiz-wrap {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      margin: auto;
      background: rgba(20, 19, 21, 0.88);
      border: 1px solid var(--line-heavy);
      padding: 30px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 0.5px solid var(--line-light);
      padding-bottom: 12px;
    }

    .back-link {
      font-family: monospace;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: rgba(209, 199, 183, 0.45);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.25s ease;
    }

    .back-link:hover {
      color: var(--ink);
    }

    .counter {
      font-family: monospace;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: rgba(209, 199, 183, 0.45);
    }

    .counter strong {
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      margin: 0 2px;
    }

    /* 题目区 */
    .question-area {
      flex: 1;
    }

    .q-index {
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(209, 199, 183, 0.4);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-index::before {
      content: 'INDEX //';
      font-size: 7px;
    }

    .q-index .num {
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }

    .q-text {
      font-size: clamp(16px, 2.8vw, 20px);
      line-height: 1.6;
      color: var(--ink);
      margin-bottom: 28px;
      text-shadow: 0 0 1px rgba(247, 238, 223, 0.2);
      white-space: pre-wrap;
    }

    /* 选项 */
    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      font-family: inherit;
      font-size: clamp(13px, 2.2vw, 15px);
      line-height: 1.5;
      color: rgba(209, 199, 183, 0.8);
      background: rgba(209, 199, 183, 0.02);
      border: 0.5px solid var(--line-light);
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    .option .mark {
      flex: 0 0 auto;
      margin-top: 2px;
      font-family: monospace;
      font-size: 8px;
      color: rgba(209, 199, 183, 0.5);
      border: 0.5px solid var(--line-light);
      padding: 2px 5px;
      transition: all 0.25s ease;
    }

    .option:hover {
      background: rgba(209, 199, 183, 0.06);
      border-color: rgba(209, 199, 183, 0.45);
      transform: translateX(3px);
    }

    .option.selected {
      background: rgba(209, 199, 183, 0.1);
      border-color: var(--ink);
      color: var(--ink);
    }

    .option.selected .mark {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
      font-weight: 700;
    }

    /* 导航按钮 */
    .nav-row {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .nav-btn {
      flex: 1;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 12px 16px;
      color: var(--paper);
      background: transparent;
      border: 0.5px solid var(--line-light);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--line-heavy);
      color: var(--ink);
      background: rgba(209, 199, 183, 0.04);
      box-shadow: inset 0 0 10px rgba(209, 199, 183, 0.05);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn::after {
      content: 'SYS';
      position: absolute;
      top: -4px;
      right: 6px;
      font-family: monospace;
      font-size: 5px;
      color: rgba(209, 199, 183, 0.3);
      background: var(--bg);
      padding: 0 2px;
      border: 0.5px solid var(--line-light);
      line-height: 1;
    }

    /* 底部进度条 */
    .progress-zone {
      margin-top: 30px;
      border-top: 1px dashed var(--line-light);
      padding-top: 16px;
    }

    .progress-track {
      height: 2px;
      background: rgba(209, 199, 183, 0.1);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--ink);
      box-shadow: 0 0 6px rgba(247, 238, 223, 0.4);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 8px;
      font-family: monospace;
      letter-spacing: 1px;
      color: rgba(209, 199, 183, 0.4);
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 14px 30px;
      }
      .quiz-wrap {
        padding: 20px 16px;
      }
      .nav-row {
        margin-top: 24px;
      }
      .nav-btn {
        padding: 10px 8px;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="quiz-wrap" id="quizWrap">
    <header class="top-bar">
      <button class="back-link" id="backHome" type="button">← RETURN TO COVER</button>
      <div class="counter">FILE <strong id="currentNum">1</strong> / 45</div>
    </header>

    <main class="question-area">
      <div class="q-index"><span class="num" id="qIndex">01</span></div>
      <h2 class="q-text" id="qText">加载中...</h2>
      <div class="options" id="options"></div>
    </main>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" type="button">PREV // 上一题</button>
      <button class="nav-btn" id="nextBtn" type="button">NEXT // 下一题</button>
    </div>

    <footer class="progress-zone">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span>RECORD PROGRESS</span>
        <span id="progressText">00 / 45</span>
      </div>
    </footer>
  </div>

  <script>
    const QUESTIONS = [
      {
        text: "I：某天你从睡梦中醒来，发现你自己穿越进了友人写的小说里，她给你留了一张便条：宝子玩得快乐！你的第一反应是？",
        options: [
          { text: "这谁给我报的名？", scores: { 谨慎: 2 } },
          { text: "呵，有趣的女人。", scores: { 神秘: 2 } },
          { text: "噢噢噢冲冲冲", scores: { 热情: 2 } },
          { text: "这福气给你要不要？", scores: { 不屈: 2 } },
          { text: "我记得她写的好像是……", scores: { 智慧: 2 } },
          { text: "啥意思？算了来都来了", scores: { 天真: 2 } },
          { text: "你这不是拐卖人口吗？", scores: { 正义: 2 } },
          { text: "既然是她写的那肯定要好好体验。", scores: { 忠诚: 2 } },
          { text: "写的什么东西也配让我亲自体验？", scores: { 骄傲: 2 } }
        ]
      },
      {
        text: "II：白光一现，你发现你身处于？",

          { text: "安静森冷的宫殿", scores: { 天真: 2, 忠诚: 2, 正义: 2, 骄傲: 2 } },
          { text: "鱼龙混杂的市集", scores: { 神秘: 2, 谨慎: 2 } }
        ]
      },
      {
        text: "III：你检查了以下身上的物品，发现除了一点金币，友人还给你留了？",
        options: [
          { text: "一柄锋利的匕首", scores: { 热情: 2 } },
          { text: "一本《九域大陆企划食用指南》", scores: { 智慧: 2 } },
          { text: "一枚徽章", scores: { 骄傲: 2 } },
          { text: "一条精美的首饰", scores: { 忠诚: 2 } },
          { text: "一把由木头制成的弓", scores: { 正义: 2 } },
          { text: "一根棍子", scores: { 天真: 2 } },
          { text: "一把螺丝刀", scores: { 不屈: 2 } },
          { text: "很多看起来是废品的不知名物品", scores: { 谨慎: 2 } },
          { text: "一把尤克里里", scores: { 神秘: 2 } }
        ]
      },
      {
        text: "IV：你收拾好东西离开这里。不知走了多久，你终于找到了一家酒馆。进入酒馆，你打算？",
        options: [
          { text: "沉默地找个角落，观察四周", scores: { 神秘: 2, 谨慎: 2 } },
          { text: "找座位坐下，研究手中的物品", scores: { 骄傲: 2, 智慧: 2 } },
          { text: "找个看起来友善的人问问", scores: { 热情: 2 } },
          { text: "你饿坏了，先吃一顿", scores: { 天真: 2, 不屈: 2 } },
          { text: "看看酒馆里的报纸或是记事板", scores: { 忠诚: 2, 正义: 2 } }
        ]
      },
      {
        text: "V：这时，一个人鬼鬼祟祟地走近你，询问你需不需要情报，你的反应是？",
        options: [
          { text: "天下没有免费的午餐，你要什么？", scores: { 智慧: 2, 神秘: 2 } },
          { text: "先与他周旋一番，探探他的底细", scores: { 谨慎: 2, 不屈: 2, 热情: 2 } },
          { text: "给他一枚银币，让他自己看着说", scores: { 忠诚: 2, 正义: 2 } },
          { text: "不搭理他", scores: { 骄傲: 2, 天真: 2 } }
        ]
      },
      {
        text: "VI：情报贩子并没有给出什么有用的信息。\n你们的交谈声吸引了一个人的注意，她上前一步，将你从这场对话里解救出来。把那个情报贩子打发走后，她仔细地端详着你的脸，半天来了一句：【你和我认识的一个人好像！】\n你对女孩的印象是？",
        options: [
          { text: "一个看起来很普通、没什么特点的人", scores: { 谨慎: 2, 不屈: 2, 骄傲: 2 } },
          { text: "一个看起来很有书卷气的人", scores: { 忠诚: 2, 正义: 2 } },
          { text: "一个明明在笑着，眼神有些冷淡的人", scores: { 神秘: 2, 热情: 2 } },
          { text: "一个拥有清澈双眼的人", scores: { 智慧: 2, 天真: 2 } }
        ]
      },
      {
        text: "VII：你和女孩寒暄了一会，她邀请你明天一起吃早餐。告别女孩后你回到房间，你的友人和你在梦中相聚。你向她询问回到现实世界的方法，她反而询问你希望来一场怎样的旅行，你的回答是？",

      },
      {
        text: "VIII：【达成目标就能离开噢！】友人这样说着就离开了。早餐时间，女孩希望能与你一同冒险，你犹豫着同意了。第一站你们即将前往金穗之谷，根据你的了解，你觉得这是一个？",
        options: [
          { text: "满是金黄稻谷的富饶之地", scores: { 智慧: 2, 忠诚: 2, 正义: 2 } },
          { text: "诞生勇者与冒险的新手村", scores: { 热情: 2, 谨慎: 2 } },

      },

        options: [

          { text: "B级【职业冒险者】", scores: { 不屈: 2, 忠诚: 2, 正义: 2 } },
          { text: "C级【见习冒险者】", scores: { 骄傲: 2 } },
          { text: "D级【学徒冒险者】", scores: { 谨慎: 2 } },
          { text: "哇你对稻草人的伤害高达惊人的0", scores: { 智慧: 2 } }

      {
        text: "X：你们来到当地的一家有名的酒馆，女孩热情的给你介绍美食。你从身边的架子上拿过本册子，上面介绍了十大赏金猎人，看见位于榜首的女孩，你认为？",
        options: [
          { text: "她一定是个努力的人", scores: { 智慧: 2, 热情: 2, 天真: 2, 谨慎: 2 } },
          { text: "她一定是个强大的人", scores: { 骄傲: 2, 不屈: 2 } },
          { text: "她一定有属于自己的目标", scores: { 忠诚: 2, 正义: 2, 神秘: 2 } }
        ]
      },
      {
        text: "XI：路过小贩，你想起友人说过的可以带些纪念品，你想要？",

    const TOTAL = 45;
    let current = 0;
    const answers = new Array(TOTAL).fill(null);
    const attrScores = {};

    const quizWrap = document.getElementById("quizWrap");
    const qIndexEl = document.getElementById("qIndex");
    const qTextEl = document.getElementById("qText");
    const optionsEl = document.getElementById("options");
    const currentNumEl = document.getElementById("currentNum");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const backHome = document.getElementById("backHome");

    let heightAnimationTimer = null;

    function render() {
      const isFirstRender = !quizWrap.dataset.initialized;

      // 1. 记录当前高度并清理可能正在进行的动画
      if (heightAnimationTimer) {
        clearTimeout(heightAnimationTimer);
        quizWrap.style.transition = 'none';
        quizWrap.style.height = 'auto';
        quizWrap.style.overflow = '';
        heightAnimationTimer = null;
      }
      const firstHeight = isFirstRender ? 0 : quizWrap.offsetHeight;

      // 2. 更新 DOM 内容
      const q = QUESTIONS[current];
      qIndexEl.textContent = String(current + 1).padStart(2, "0");
      currentNumEl.textContent = current + 1;
      qTextEl.textContent = q.text;

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        if (answers[current] === i) btn.classList.add("selected");

        btn.innerHTML = `
          <span class="mark">${String.fromCharCode(65 + i)}</span>
          <span class="label">${opt.text}</span>
        `;

        btn.addEventListener("click", () => selectOption(i));
        optionsEl.appendChild(btn);
      });

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === TOTAL - 1 ? "FINALIZE // 提交" : "NEXT // 下一题";
      updateProgress();

      if (isFirstRender) {
        quizWrap.dataset.initialized = "true";
        return;
      }

      // 3. FLIP 动画：平滑改变外部框的高度
      quizWrap.style.height = 'auto';
      const lastHeight = quizWrap.offsetHeight;

      quizWrap.style.height = firstHeight + 'px';
      quizWrap.style.overflow = 'hidden';

      void quizWrap.offsetHeight; // 强制重排

      quizWrap.style.transition = 'height 0.35s cubic-bezier(0.22, 1, 0.36, 1)';
      quizWrap.style.height = lastHeight + 'px';

      heightAnimationTimer = setTimeout(() => {
        quizWrap.style.transition = 'none';
        quizWrap.style.height = 'auto';
        quizWrap.style.overflow = '';
        heightAnimationTimer = null;
      }, 350);
    }

    function selectOption(index) {
      const prev = answers[current];
      if (prev !== null) {
        applyScores(QUESTIONS[current].options[prev].scores, -1);
      }
      answers[current] = index;
      applyScores(QUESTIONS[current].options[index].scores, 1);
      render();
    }

    function applyScores(scores, sign) {
      if (!scores) return;
      for (const [key, value] of Object.entries(scores)) {
        attrScores[key] = (attrScores[key] || 0) + value * sign;
      }
    }

    function updateProgress() {
      const answered = answers.filter((a) => a !== null).length;
      const percent = (answered / TOTAL) * 100;
      progressFill.style.width = percent + "%";
      progressText.textContent = `${String(answered).padStart(2, '0')} / ${TOTAL}`;
    }

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current--;
        render();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (current < TOTAL - 1) {
        current++;
        render();
      } else {
        // 最后一题校验
        const firstUnanswered = answers.findIndex((a) => a === null);
        if (firstUnanswered !== -1) {
          alert(`INDEX ERROR // 第 ${firstUnanswered + 1} 题尚未归档，请返回作答。`);
          current = firstUnanswered;
          render();
          return;
        }

        // 1. 补全所有未点到的属性为 0
        const finalScores = {
          智慧: 0, 热情: 0, 不屈: 0, 天真: 0, 
          忠诚: 0, 正义: 0, 骄傲: 0, 神秘: 0, 谨慎: 0
        };
        for (let key in attrScores) {
          if (finalScores[key] !== undefined) {
            finalScores[key] = attrScores[key];
          }
        }

        // 2. 存入 localStorage
        localStorage.setItem("quizResult", JSON.stringify(finalScores));
        
        // 3. 跳转结果页
        window.location.href = "result.html";
      }
    });

    backHome.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    render();
  </script>
